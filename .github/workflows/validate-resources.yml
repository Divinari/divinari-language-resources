name: Validate Community Language Resources

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linguistic-pr:
    name: Schema, Deduplication, Provenance & Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Head Safely
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Validator Dependencies
        run: python -m pip install --no-cache-dir -r validation/requirements.txt

      - name: 1. JSON / YAML Syntax & UTF-8 NFC Normalization Check
        run: python validation/run_checks.py --check syntax-and-encoding

      - name: 2. JSON Schema Validation (Draft 2020-12)
        run: python validation/run_checks.py --check schema --schemas-dir schemas/

      - name: 3. Duplicate Detection & Concept/Span Integrity
        run: python validation/run_checks.py --check duplicates-and-spans

      - name: 4. Required Metadata & License/Provenance Verification
        run: python validation/run_checks.py --check provenance-and-license

      - name: 5. Anti-Synthetic & Placeholder Pollution Guard
        run: python validation/run_checks.py --check anti-synthetic

      - name: 6. Canonical Formatting Check (2-Space JSON / LF / Trailing Newline)
        run: python validation/run_checks.py --check formatting

      - name: 7. Run Validator Self-Tests
        run: pytest -q validation/tests/
